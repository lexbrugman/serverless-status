name: Release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          # Tag arithmetic needs the full tag history.
          fetch-depth: 0

      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh
