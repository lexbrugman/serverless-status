name: Tofu Checks

# init -backend=false + validate + tflint over each module directory.
# Formatting is lint.sh's job (the lint-test gate); module behavior tests
# run in test.sh (same gate); this job proves each module stands alone.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The matrix is discovered, not listed. A named list can go short without
  # going empty, and the module it forgot stays green because the only job
  # that would notice is not pointed at it — which is how an unused
  # declaration lived in modules/alerting until somebody ran the job by hand.
  modules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.discover.outputs.list }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Discover the modules
        id: discover
        run: echo "list=$(scripts/list-modules.sh)" >> "$GITHUB_OUTPUT"

  tofu-checks:
    needs: [modules]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.list) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pinned tools
        uses: ./.github/actions/setup-pinned-tools
        with:
          tools: |
            tofu
            tflint

      - name: Validate ${{ matrix.module }}
        run: scripts/tofu-checks.sh "${{ matrix.module }}"

  # The template is validated from a temp copy with sources rewritten to
  # local paths — the ref it will be stamped with does not exist yet.
  template:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pinned tools
        uses: ./.github/actions/setup-pinned-tools
        with:
          tools: |
            tofu
            tflint

      - name: Validate the template
        run: scripts/check-template.sh

  # The one surface no plan or test can see: the payloads the provider
  # actually transmits to the SM API — the SMTP dialogue's order and the
  # attribute mappings each check type relies on. Applied for real against
  # a local mock, with the pinned provider version.
  sm-payloads:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pinned tools
        uses: ./.github/actions/setup-pinned-tools
        with:
          tools: |
            tofu
            python

      - name: Verify transmitted check payloads
        run: scripts/check-sm-payloads.py
