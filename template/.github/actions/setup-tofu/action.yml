name: Set up pinned tofu
description: >-
  Install OpenTofu at the version the pinned release's CI tested. Both the
  repository and the ref come from the module source in page.tf, so the
  installer shares the module code's trust root exactly.

runs:
  using: composite
  steps:
    - name: Install pinned tofu
      shell: bash
      run: |
        set -euo pipefail
        module_ref="$(sed -n 's/.*?ref=\([^"]*\)".*/\1/p' page.tf | head -n 1)"
        upstream="$(sed -n 's|.*"github.com/\([^/]*/[^/]*\)//modules/.*|\1|p' page.tf | head -n 1)"
        base="https://raw.githubusercontent.com/${upstream}/${module_ref}"
        curl -fsSL "$base/versions.env" -o "$RUNNER_TEMP/versions.env"
        curl -fsSL "$base/bin/install-tofu.sh" -o "$RUNNER_TEMP/install-tofu.sh"
        chmod +x "$RUNNER_TEMP/install-tofu.sh"
        set -a
        source "$RUNNER_TEMP/versions.env"
        set +a
        "$RUNNER_TEMP/install-tofu.sh" "$RUNNER_TEMP/tools"
        echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
