name: Bootstrap

# One-time: builds everything from an empty AWS account in two dispatches,
# with no stored AWS credentials at any point. Prerequisite (see the setup
# guide): the GitHub OIDC provider and an admin role named
# serverless-status-apply, created in the IAM console. The first apply
# imports both, and from then on their trust is managed — narrowed to the
# production environment, so console-wizard sloppiness converges to the
# written policy.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: >-
          checks = state bucket + the Grafana checks only, for the manual
          step-zero verification; all = everything, printing the handover.
        required: true
        type: choice
        options:
          - checks
          - all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VAR_grafana_cloud_tokens: ${{ secrets.GRAFANA_CLOUD_TOKENS }}
  TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The role's managed trust accepts only runs bound to this environment.
    environment: production
    permissions:
      # The state bucket's local state file is committed back.
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up pinned tofu
        uses: ./.github/actions/setup-tofu

      # The hand-made trust must match these exact claims; printing them
      # turns a refused assume from archaeology into a diff.
      - name: Show the token identity
        run: |
          set -euo pipefail
          curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value' | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null \
            | jq '{iss, aud, sub}'

      - name: Assume the apply role
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.APPLY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Create the state bucket
        run: |
          set -euo pipefail
          if [[ -f bootstrap/terraform.tfstate ]]; then
            echo "state bucket already exists"
            exit 0
          fi
          tofu -chdir=bootstrap init -input=false
          tofu -chdir=bootstrap apply -input=false -auto-approve -var-file=../state.auto.tfvars
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bootstrap/terraform.tfstate bootstrap/.terraform.lock.hcl
          git commit -m "Create the state bucket"
          git push

      - name: Adopt the hand-made trust
        run: |
          set -euo pipefail
          tofu init -input=false -backend-config=state.auto.tfvars
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          state="$(tofu state list 2>/dev/null || true)"
          if ! grep -q 'module.ci.aws_iam_openid_connect_provider.github' <<<"$state"; then
            tofu import -input=false 'module.ci.aws_iam_openid_connect_provider.github' \
              "arn:aws:iam::${account_id}:oidc-provider/token.actions.githubusercontent.com"
          fi
          if ! grep -q 'module.ci.aws_iam_role.apply$' <<<"$state"; then
            tofu import -input=false 'module.ci.aws_iam_role.apply' serverless-status-apply
          fi

      - name: Apply the checks (step zero)
        if: inputs.phase == 'checks'
        run: |
          set -euo pipefail
          targets=()
          for file in org_*.tf; do
            org="${file#org_}"
            targets+=("-target=module.checks_${org%.tf}")
          done
          tofu apply -input=false -auto-approve "${targets[@]}"
          {
            echo "## Step zero applied"
            echo
            echo "Verify in the Grafana console before going further:"
            echo "- \`probe_success\` reports 1 for the smtp checks (port-25 egress works)"
            echo "- the TCP dialogue steps read greeting, EHLO, STARTTLS, upgrade, EHLO, QUIT — in that order"
            echo
            echo "Then dispatch this workflow again with phase: **all**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply everything
        if: inputs.phase == 'all'
        run: |
          set -euo pipefail
          tofu apply -input=false -auto-approve
          {
            echo "## Bootstrap complete — finish the handover"
            echo
            echo "- repository variable \`PLAN_ROLE_ARN\`: \`$(tofu output -raw plan_role_arn)\`"
            echo "- restrict the \`production\` environment's deployment branches to master"
            echo "- verify the page and certificate at: \`$(tofu output -raw distribution_domain)\`"
          } >> "$GITHUB_STEP_SUMMARY"
