name: Bootstrap

# One-time: builds everything from an empty AWS account in two dispatches,
# with no stored AWS credentials at any point. Prerequisite (see the setup
# guide): the GitHub OIDC provider and an admin role named
# serverless-status-apply, created in the IAM console. Phase all imports
# both, and from then on their trust is managed — narrowed to the
# production environment, so console-wizard sloppiness converges to the
# written policy.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: >-
          checks = state bucket + the Grafana checks only, for the manual
          step-zero verification; all = everything, printing the handover.
        required: true
        type: choice
        options:
          - checks
          - all

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    permissions:
      # The state bucket's local state file is committed back.
      contents: write
      id-token: write
    secrets: inherit
    uses: ./.github/workflows/run-bootstrap.yml
    with:
      phase: ${{ inputs.phase }}
