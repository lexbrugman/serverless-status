name: Bootstrap Gate

# Whether routine CI may run, and the role it plans with — both derived
# from the repository itself, so nothing has to be copied into settings
# after a bootstrap.
on:
  workflow_call:
    outputs:
      bootstrapped:
        description: "true once the bootstrap has completed."
        value: ${{ jobs.gate.outputs.bootstrapped }}
      plan_role_arn:
        description: ARN of the read-only role plan and drift assume.
        value: ${{ jobs.gate.outputs.plan_role_arn }}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bootstrapped: ${{ steps.gate.outputs.bootstrapped }}
      plan_role_arn: ${{ steps.gate.outputs.plan_role_arn }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Resolve the bootstrap state
        id: gate
        env:
          APPLY_ROLE_ARN: ${{ vars.APPLY_ROLE_ARN }}
        run: bin/ci-bootstrap-gate.sh
