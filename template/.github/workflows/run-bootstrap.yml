name: Run Bootstrap

# Generates the org structure, creates the state bucket, applies the
# Grafana checks, verifies step zero, adopts the hand-made trust, and
# applies the rest. Every step is idempotent, so a failed run is
# re-dispatched, not repaired.
on:
  workflow_call:

permissions:
  contents: write
  id-token: write

env:
  TF_VAR_grafana_cloud_tokens: ${{ secrets.GRAFANA_CLOUD_TOKENS }}
  TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    # Step zero waits for live probe results, and the final apply waits for
    # ACM issuance.
    timeout-minutes: 90
    # The role's managed trust accepts only runs bound to this environment.
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # First contact with a freshly filled-in instance: the org structure
      # is generated from the orgs map before anything is applied.
      - name: Resolve the instance region
        run: bin/ci-resolve-region.sh

      - name: Resolve the repository identity
        uses: ./.github/actions/resolve-repository

      - name: Set up pinned tofu
        uses: ./.github/actions/setup-tofu

      - name: Sync the instance
        env:
          PUSH_BRANCH: ${{ github.ref_name }}
        run: bin/ci-sync.sh

      - name: Assume the apply role
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create the state bucket
        run: bin/ci-create-state-bucket.sh

      - name: Apply the checks
        run: bin/ci-bootstrap-checks.sh

      - name: Verify step zero
        run: bin/ci-verify-step-zero.py

      # Only possible after the checks apply: an import evaluates the whole
      # configuration, and the sm providers are configured from the
      # installations it creates.
      - name: Adopt the hand-made trust
        run: bin/ci-adopt-trust.sh

      - name: Apply everything
        run: bin/ci-bootstrap-all.sh

      - name: Mark the bootstrap complete
        env:
          PUSH_BRANCH: ${{ github.ref_name }}
        run: bin/ci-bootstrap-complete.sh
