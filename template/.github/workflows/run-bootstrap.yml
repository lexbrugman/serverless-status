name: Run Bootstrap

# Creates the state bucket, then applies the requested phase — checks
# only (step zero), or the trust adoption plus everything and the
# handover summary. Every step is idempotent, so a failed run is re-run,
# not repaired.
on:
  workflow_call:
    inputs:
      phase:
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  TF_VAR_grafana_cloud_tokens: ${{ secrets.GRAFANA_CLOUD_TOKENS }}
  TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The role's managed trust accepts only runs bound to this environment.
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # First contact with a freshly filled-in instance: the org structure
      # is generated from the orgs map before anything is applied.
      - name: Sync the instance
        env:
          PUSH_BRANCH: ${{ github.ref_name }}
        run: bin/ci-sync.sh

      - name: Set up pinned tofu
        uses: ./.github/actions/setup-tofu

      - name: Assume the apply role
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.APPLY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Create the state bucket
        run: bin/ci-create-state-bucket.sh

      - name: Apply the checks (step zero)
        if: inputs.phase == 'checks'
        run: bin/ci-bootstrap-checks.sh

      # The dialogue as the backend stores it is what the probes execute;
      # printing it makes a scrambled conversation a readable diff instead
      # of a probe-log excavation.
      - name: Report the stored dialogue
        if: inputs.phase == 'checks'
        run: bin/ci-dialogue-report.py

      # Adoption happens in phase all, never earlier: an import evaluates
      # the whole configuration, and the sm provider configs only become
      # evaluable once phase checks has put the installations in state.
      - name: Adopt the hand-made trust
        if: inputs.phase == 'all'
        run: bin/ci-adopt-trust.sh

      - name: Apply everything
        if: inputs.phase == 'all'
        run: bin/ci-bootstrap-all.sh
