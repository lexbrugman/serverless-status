name: CI

# PRs get a plan posted as a comment — the review gate, and what makes a
# Renovate ref-bump PR meaningful. Pushes to master auto-apply from the
# protected production environment.
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

# Applies must never interleave; a superseded run's commits apply with the
# run that replaced it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# Routine CI switches on at the handover: PLAN_ROLE_ARN is set after the
# bootstrap's final phase, and until then these jobs skip rather than fail
# against half-built trust.
jobs:
  plan:
    if: github.event_name == 'pull_request' && vars.PLAN_ROLE_ARN != ''
    permissions:
      # write on contents: the sync commit lands on the PR branch.
      contents: write
      id-token: write
      pull-requests: write
    secrets: inherit
    uses: ./.github/workflows/plan.yml

  apply:
    if: github.event_name == 'push' && vars.PLAN_ROLE_ARN != ''
    permissions:
      # write on contents: a direct push that changed the orgs map gets
      # its regenerated structure committed back before applying.
      contents: write
      id-token: write
    secrets: inherit
    uses: ./.github/workflows/apply.yml
