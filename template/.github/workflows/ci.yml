name: CI

# PRs get a plan posted as a comment — the review gate, and what makes a
# Renovate ref-bump PR meaningful. Pushes to master auto-apply from the
# protected production environment.
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

# Applies must never interleave; a superseded run's commits apply with the
# run that replaced it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Routine CI switches on when the bootstrap completes, so pushes during
  # one stay inert rather than failing against half-built trust.
  gate:
    permissions:
      contents: read
    uses: ./.github/workflows/bootstrap-gate.yml

  plan:
    needs: [gate]
    if: github.event_name == 'pull_request' && needs.gate.outputs.bootstrapped == 'true'
    permissions:
      # write on contents: the sync commit lands on the PR branch.
      contents: write
      id-token: write
      pull-requests: write
    secrets: inherit
    uses: ./.github/workflows/plan.yml
    with:
      plan_role_arn: ${{ needs.gate.outputs.plan_role_arn }}

  apply:
    needs: [gate]
    if: github.event_name == 'push' && needs.gate.outputs.bootstrapped == 'true'
    permissions:
      # write on contents: a direct push that changed the orgs map gets
      # its regenerated structure committed back before applying.
      contents: write
      id-token: write
    secrets: inherit
    uses: ./.github/workflows/apply.yml
