name: Plan

# Syncs the instance when the PR bumps the pinned release, then plans the
# result and posts it as the PR's review comment.
on:
  workflow_call:
    inputs:
      plan_role_arn:
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  pull-requests: write

env:
  TF_VAR_grafana_cloud_tokens: ${{ secrets.GRAFANA_CLOUD_TOKENS }}
  TF_VAR_state_passphrase: ${{ secrets.STATE_PASSPHRASE }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # The branch tip, not the merge commit: the sync commit must land on
      # the branch itself.
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Sync the instance
        env:
          PUSH_BRANCH: ${{ github.head_ref }}
        run: bin/ci-sync.sh

      - name: Resolve the repository identity
        uses: ./.github/actions/resolve-repository

      - name: Set up pinned tofu
        uses: ./.github/actions/setup-tofu

      - name: Assume the plan role
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ inputs.plan_role_arn }}
          aws-region: eu-west-1

      - name: Plan
        run: bin/ci-plan.sh

      - name: Comment the plan on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bin/ci-comment-plan.sh
