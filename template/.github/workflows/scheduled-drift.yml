name: Scheduled Drift

# A console click is found the next morning rather than never.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# The same group routine CI uses: a drift plan taking the state lock while
# an apply holds it fails the run for a reason that has nothing to do with
# drift. cancel-in-progress stays false for the reason it does there — an
# apply is never the thing that gets superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    permissions:
      contents: read
    uses: ./.github/workflows/bootstrap-gate.yml

  drift:
    needs: [gate]
    if: needs.gate.outputs.bootstrapped == 'true'
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    uses: ./.github/workflows/drift.yml
    with:
      plan_role_arn: ${{ needs.gate.outputs.plan_role_arn }}
