name: Scheduled Drift

# A console click is found the next morning rather than never.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    # Skips until the bootstrap handover sets PLAN_ROLE_ARN.
    if: vars.PLAN_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    uses: ./.github/workflows/drift.yml
