name: Scheduled Drift

# A console click is found the next morning rather than never.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    permissions:
      contents: read
    uses: ./.github/workflows/bootstrap-gate.yml

  drift:
    needs: [gate]
    if: needs.gate.outputs.bootstrapped == 'true'
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    uses: ./.github/workflows/drift.yml
    with:
      plan_role_arn: ${{ needs.gate.outputs.plan_role_arn }}
